[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recons101x"
version = "1.0.0"
description = "Portable passive hostname reconnaissance through Shodan CTL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["shodan", "reconnaissance", "subdomains", "security", "osint"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DevCop95/shodan_reconsx"
Issues = "https://github.com/DevCop95/shodan_reconsx/issues"
Repository = "https://github.com/DevCop95/shodan_reconsx.git"

[project.scripts]
recons101x = "recons101x:main"

[tool.setuptools]
py-modules = ["recons101x"]
package-dir = {"" = "src"}
